    ## Fonts (casks, MacBook only; Linux uses the shared installer below)
    fonts_casks:
      - font-lato
      - font-hack
      - font-open-sans
      - font-roboto
      - font-fira-code-nerd-font
      - font-jetbrains-mono-nerd-font

    ## Mac App Store (mas) — id: name ------------------------------------------
    mas:
      Spark Mail: 6445813049
      WhatsApp: 310633997
      Yubico Authenticator: 1497506650
      Transporter: 1450874784
      RocketSim for Xcode Simulator: 1504940162
      Infuse: 1136220934
      Pure Paste: 1611378436
      Brother iPrint$Scan: 1193539993
      WireGuard: 1451685025

    ## Vendor DMGs — no brew cask, no MAS. 11-install-extra-apps
    ## installs them via curl → hdiutil → /Applications; apps self-update in-app
    ## (Sparkle / electron-updater / vendor updater). Rules:
    ##   version: ""  → install-if-missing only (default; let the app update itself)
    ##   version: X   → pin; re-installs at `latest` when X changes
    ##   url         → default (universal / x86_64 fallback)
    ##   url_arm64 / url_x86_64 → arch override; "" = fall back to `url`
    custom_apps:
      astro: # tryastro.app (single universal DMG)
        app: /Applications/Astro.app
        version: ""
        url: https://github.com/matteospada/astro/releases/latest/download/Astro.dmg
        url_arm64: ""
        url_x86_64: ""
      pen: # pen.dev (arch-specific DMGs)
        app: /Applications/Pen.app
        version: ""
        url: https://pen.dev/download/Pen-mac-x64.dmg
        url_arm64: https://pen.dev/download/Pen-mac-arm64.dmg
        url_x86_64: ""

  # ---------------------------------------------------------------------------
  ## Arch / Omarchy — pacman + Omarchy's built-in PM ----------------------
  ## Same cross-platform CLI set as the brew list above.
  arch:
    pacman:
      - fish
      - tmux
      - starship
      - bat
      - eza
      - zoxide
      - fd
      - fzf
      - atuin
      - ripgrep
      - jq
      - yazi
      - git
      - git-lfs
      - difftastic
      - github-cli
      - lazygit
      - gitleaks
      - btop
      - gnupg
      - cmake
      - openssl
      - curl
      - unzip # required by the shared Nerd Font installer
      - fontconfig # refreshes the font cache after Nerd Font installation
      - tailscale # tailnet — zero-trust mesh; Tailscale SSH server via the 12-tailscale script
      # first-pass; validate each against the Omarchy repos on boot
    omarchy_extra: [] # Omarchy-specific packages via its built-in PM — fill at install time

  # ---------------------------------------------------------------------------
  ## Debian/Ubuntu dev boxes — apt ----------------------------------------------
  ## NOTE: Debian stable ships RENAMED or OLD tools → mise covers those.
  debian:
    apt:
      - fish git curl unzip ca-certificates build-essential fontconfig
      - tmux ripgrep fzf btop gnupg jq yazi
    # tailscale isn't in Debian's default repos → the 12-tailscale script adds the official repo
    # ships as `batcat`/`fdfind` → aliases added in fish config
    apt_renamed:
      bat: batcat
      fd: fdfind
