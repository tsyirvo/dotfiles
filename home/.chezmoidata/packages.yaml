      - cursor # AI editor
      - zed # editor (config shipped via dot_config/zed)
      - android-studio # Android IDE
      # Terminals
      - ghostty # terminal
      # Browsers
      - zen # zen browser
      - google-chrome # chrome (dev + default fallback)
      # Mobile dev tools
      - androidtool # android ADB/Fastboot GUI
      - genymotion # Android emulator
      - android-platform-tools # adb/fastboot
      - proxyman # http debug proxy
      # Dev tools
      - ngrok # ngrok (authtoken out-of-band)
      - orbstack # docker engine + linux VMs
      - gitkraken # git GUI
      - postman # api client
      - bruno # api client
      # Communication
      - slack
      - discord
      - telegram
      # Productivity
      - notion
      - notion-calendar
      - reader # readwise reader
      - obsidian
      - linear
      # Design & UI
      - figma
      - rotato # mockup tool
      - capcut # video editor
      - paper-design # paper app
      # Proton tools
      - proton-drive
      - protonvpn
      - proton-mail
      # Elgato tools
      - elgato-camera-hub
      - elgato-stream-deck
      - elgato-wave-link
      # Multimedia
      - vlc
      - spotify
      - steam
      - reflex-app # reflex games
      - soulseek # soulseek music sharing
      - calibre # ebook manager
      - brainfm # focus music
      # AI
      - claude # Claude desktop
      - claude-code # Claude code CLI
      - codex # OpenAI codex desktop
      - factory # factory.ai
      - droid # Droid CLI
      - conductor # conductor (agent desktop)
      - codexbar # AI sub usage
      - stablyai/orca/orca # AI agent desktop environment
      # Keyboards & Peripherals
      - logi-options-plus
      - logitech-g-hub
      - via # keyboard configurator
      - homerow # keyboard shortcuts
      - hyperkey # ctrl/cmd remap
      # 3D Tooling
      - bambu-studio # 3D printer suite
      # Security
      - oversight
      - taskexplorer
      - knockknock
      # Misc
      - macdown # markdown editor
      - carbon-copy-cloner # backup
      - rocket # emoji picker
      - tailscale-app # tailnet client — GUI app bundles the CLI, symlinked by 12-tailscale
      - coconutbattery
      - aldente # battery charge limiter
      - istat-menus
