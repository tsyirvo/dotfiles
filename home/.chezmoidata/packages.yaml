      - raycast # launcher
      - nikitabobko/tap/aerospace # tiling WM (tap also declared above)
      - the-unarchiver
      - cleanshot # screenshot tool
      - lookaway # eye break reminder
      - flux-app # screen warmth
      - imageoptim
      - clop # clipboard/compression
      - pika # color picker
      - voiceink # voice input
      # Quicklook
      - qlcolorcode
      - qlmarkdown
      - quicklook-csv
