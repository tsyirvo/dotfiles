on: [push, pull_request]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
      - run: mise install
      - run: mise run check:shellcheck # renders *.tmpl scripts, shellchecks rendered + static
      - run: mise run check:gitleaks
      - run: mise run check:workflows # actionlint + zizmor (guards this file itself)

  apply-debian:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - run: bash tasks/ci/test.sh devbox debian:bookworm # full script execution in a container

  apply-arch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - run: bash tasks/ci/test.sh omarchy archlinux:latest

  apply-darwin:
    runs-on: macos-26
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      # install from mise.toml (pins chezmoi to the .chezmoiversion); brew's
      # formula lags the release and fails "source state requires ... or later"
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
      - run: |
          set -euo pipefail
          home="$RUNNER_TEMP/home"; mkdir -p "$home"
          # init renders the real config template (the derived flags macOS
          # templates need come from .chezmoi.toml.tmpl — promptChoice isn't
          # available outside init, so a hand-written [data] block can't work)
          chezmoi --source "$GITHUB_WORKSPACE" --destination "$home" \
            --config "$RUNNER_TEMP/chezmoi.toml" --cache "$RUNNER_TEMP/cache" \
            --persistent-state "$RUNNER_TEMP/state/chezmoistate.boltdb" \
            --no-tty --force init --apply --exclude=scripts
          chezmoi --source "$GITHUB_WORKSPACE" --destination "$home" \
            --config "$RUNNER_TEMP/chezmoi.toml" --no-tty verify --exclude=scripts
      # scripts are skipped here (they install real packages); containers + real machines cover them
